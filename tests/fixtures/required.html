<!doctype html>
<html>
<head><title>Required fields</title></head>
<body>
  <input aria-label="Budget name (required)">
  <input aria-label="Amount - required" value="1">
  <input role="combobox" aria-expanded="false" aria-label="Role required">
  <input role="combobox" aria-expanded="false" aria-label="Runtime required" value="Python 3.14">
  <select aria-label="Period required"><option selected>Monthly</option></select>
  <input type="checkbox" aria-label="Accept terms required">
  <input type="checkbox" aria-label="Enable logging required" checked>
  <input aria-label="Description, not required">
  <input aria-label="Notes">
  <label><input type="radio" name="plan"> Plan required</label>
  <a href="/permissions">Required permissions</a>
  <button>Create required resources</button>
</body>
</html>
