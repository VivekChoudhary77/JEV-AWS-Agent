<!doctype html>
<html>
<head><title>Overlay</title></head>
<body>
  <button>Real button</button>
  <p>Real text</p>
  <div role="alert">Real alert</div>
  <div data-jev-ignore style="width: 200px; height: 100px">
    <button>Overlay button</button>
    <input aria-label="Overlay input">
    <div role="alert">Overlay alert</div>
    <div role="progressbar" style="width: 20px; height: 20px">Overlay progress</div>
    <div role="dialog"><h2>Overlay dialog</h2></div>
    Overlay text
  </div>
</body>
</html>
